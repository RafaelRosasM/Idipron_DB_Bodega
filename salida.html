<!DOCTYPE html>
<html>
  <body>
    <h3>Registrar Salida de Equipo</h3>

    <div class="campo">
      <label for="responsable">Responsable:</label>
      <select id="responsable" class="input-estilizado"></select>
    </div>

    <div class="campo">
      <label for="idEquipo">ID (Placa de equipo):</label>
      <input type="text" id="idEquipo" class="input-estilizado" placeholder="Ingrese al menos 3 caracteres para buscar...">
      <ul id="listaResultados" class="resultados"></ul>
    </div>

    <div class="campo">
      <label for="nombreEquipo">Equipo:</label>
      <input type="text" id="nombreEquipo" class="input-estilizado" readonly>
    </div>

    <div class="campo">
      <label for="cantidad">Cantidad:</label>
      <input type="number" id="cantidad" min="1" class="input-estilizado">
    </div>

    <div class="campo">
      <label for="fecha">Fecha de Movimiento:</label>
      <input type="date" id="fecha" class="input-estilizado" required>
    </div>

    <!-- NUEVO CAMPO UPI -->
    <div class="campo">
      <label for="upi">UPI:</label>
      <select id="upi" class="input-estilizado"></select>
    </div>

    <button id="btnSalida" class="btn-salida" onclick="enviar()">
      <span id="spinner" class="spinner" style="display:none;"></span>
      <span id="btnText">Registrar Salida ➡️</span>
    </button>

    <div id="mensaje" style="margin-top:10px; font-weight:bold; color:green;"></div>

    <style>
      body { font-family: 'Segoe UI', Tahoma, sans-serif; }
      .campo { margin-bottom: 15px; position: relative; }
      label { display: block; font-weight: 600; margin-bottom: 5px; color: #333; }
      .input-estilizado {
        width: 95%; padding: 8px 10px; border: 1px solid #ccc;
        border-radius: 6px; background-color: #f9f9f9;
        font-size: 14px; transition: border-color 0.3s, box-shadow 0.3s;
      }
      .input-estilizado:focus {
        border-color: #16a34a; box-shadow: 0 0 4px #16a34a;
        background-color: #fff; outline: none;
      }
      .btn-salida {
        background-color: #16a34a; color: white; padding: 10px 18px;
        border: none; border-radius: 8px; font-size: 14px; font-weight: bold;
        cursor: pointer; transition: background 0.3s;
        display: inline-flex; align-items: center; gap: 8px;
      }
      .btn-salida:hover { background-color: #15803d; }

      .spinner {
        border: 3px solid #f3f3f3; border-top: 3px solid white;
        border-radius: 50%; width: 14px; height: 14px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

      .resultados {
        list-style: none; margin: 0; padding: 0;
        border: 1px solid #ccc; border-radius: 6px;
        background-color: #fff; max-height: 150px; overflow-y: auto;
        width: 95%; position: absolute; z-index: 10;
      }
      .resultados li {
        padding: 8px; cursor: pointer;
      }
      .resultados li:hover {
        background-color: #e0f2f1;
      }
    </style>

    <script>
      const hoy = new Date().toISOString().split("T")[0];
      document.getElementById("fecha").setAttribute("max", hoy);

      // Cargar responsables
      google.script.run.withSuccessHandler(function(responsables) {
        const sel = document.getElementById('responsable');
        responsables.forEach(r => {
          let opt = document.createElement('option');
          opt.value = r.id;
          opt.text = `${r.id} - ${r.nombre}`;
          sel.add(opt);
        });
      }).obtenerResponsables();

      // Cargar UPI
      google.script.run.withSuccessHandler(function(listaUPI) {
        const sel = document.getElementById("upi");
        listaUPI.forEach(u => {
          let opt = document.createElement("option");
          opt.value = u;
          opt.text = u;
          sel.add(opt);
        });
      }).obtenerUPI();

      // ============================
      // Búsqueda dinámica
      // ============================
      const inputID = document.getElementById('idEquipo');
      const lista = document.getElementById('listaResultados');
      const nombreEquipo = document.getElementById('nombreEquipo');

      inputID.addEventListener('input', function() {
        const termino = this.value.trim();
        if (termino.length < 3) {
          lista.innerHTML = '';
          return;
        }

        google.script.run.withSuccessHandler(function(resultados) {
          lista.innerHTML = '';
          resultados.forEach(r => {
            const li = document.createElement('li');
            li.textContent = `${r.id} - ${r.nombre}`;
            li.onclick = function() {
              inputID.value = r.id;
              nombreEquipo.value = r.nombre;
              lista.innerHTML = '';
            };
            lista.appendChild(li);
          });
        }).buscarEquiposPorID(termino);
      });

      function enviar() {
        const btn = document.getElementById("btnSalida");
        const spinner = document.getElementById("spinner");
        const btnText = document.getElementById("btnText");

        const datos = {
          responsable: document.getElementById('responsable').value,
          material: inputID.value,
          cantidad: parseInt(document.getElementById('cantidad').value),
          fecha: document.getElementById('fecha').value,
          upi: document.getElementById('upi').value
        };

        if (!datos.material) {
          document.getElementById('mensaje').innerHTML = "❌ Debe seleccionar un ID.";
          return;
        }

        spinner.style.display = "inline-block";
        btnText.textContent = "Registrando...";
        btn.disabled = true;

        google.script.run.withSuccessHandler(function(msg) {
          document.getElementById('mensaje').innerHTML = msg;
          spinner.style.display = "none";
          btnText.textContent = "Registrar Salida ➡️";
          btn.disabled = false;
        }).registrarSalida(datos);
      }
    </script>
  </body>
</html>
